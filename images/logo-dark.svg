<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- Jamdesk full logo with text - for dark backgrounds -->
  
  <!-- Icon: Three overlapping rounded rectangles -->
  <g transform="translate(0, 5)">
    <!-- Back rectangle (left) -->
    <rect x="2" y="8" width="18" height="24" rx="3" fill="#6366F1" fill-opacity="0.7"/>
    <!-- Middle rectangle -->
    <rect x="8" y="4" width="18" height="24" rx="3" fill="#7C3AED" fill-opacity="0.75"/>
    <!-- Front rectangle (right) -->
    <rect x="14" y="10" width="18" height="24" rx="3" fill="#A78BFA" fill-opacity="0.85"/>
  </g>
  
  <!-- "jamdesk" text - white for dark backgrounds -->
  <text x="42" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" letter-spacing="-0.5">jamdesk</text>
</svg>

