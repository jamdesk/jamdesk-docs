openapi: 3.1.0
info:
  title: Jamdesk Knowledge API
  version: "1.0.0"
  description: |
    Search your documentation programmatically from chatbots, support tools,
    and custom integrations. Uses the same semantic vector search that powers
    your docs site AI chat.

    **Authentication:** All requests require a Bearer token (API key generated
    in your [dashboard settings](https://dashboard.jamdesk.com)).

    **Base URL:** `https://YOUR-PROJECT.jamdesk.app` (or your custom domain)

servers:
  - url: https://{project}.jamdesk.app
    description: Production (subdomain)
    variables:
      project:
        default: your-project
        description: Your Jamdesk project slug

security:
  - BearerAuth: []

paths:
  /_knowledge/search:
    post:
      operationId: searchDocs
      summary: Search documentation
      description: |
        Performs semantic vector search across your documentation.
        Returns matching pages ranked by relevance score.

        The search understands natural language — queries like "how do I authenticate
        with OAuth" work better than keyword-style "OAuth authentication setup".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Natural language search query.
                  maxLength: 500
                  example: "How do I set up webhooks?"
                limit:
                  type: integer
                  description: Maximum number of results to return.
                  minimum: 1
                  maximum: 20
                  default: 5
                  example: 5
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Page title.
                          example: "Webhooks"
                        section:
                          type: string
                          description: Section heading within the page (if applicable).
                          example: "Configuration"
                        slug:
                          type: string
                          description: URL path to the page.
                          example: "integrations/webhooks"
                        content:
                          type: string
                          description: Content snippet (max 500 chars).
                          example: "Configure webhooks to receive real-time notifications when builds complete..."
                        url:
                          type: string
                          format: uri
                          description: Full URL to the page.
                          example: "https://docs.example.com/integrations/webhooks"
                        score:
                          type: number
                          format: float
                          description: Relevance score. Higher is better.
                          example: 0.92
                  query:
                    type: string
                    description: The query that was searched.
                    example: "How do I set up webhooks?"
                  total:
                    type: integer
                    description: Number of results returned.
                    example: 3
                  durationMs:
                    type: integer
                    description: Search execution time in milliseconds.
                    example: 150
              example:
                query: "How do I set up a custom domain?"
                results:
                  - title: "Custom Domains"
                    section: "Step 4: Deploy"
                    slug: "deploy/custom-domains"
                    content: "To add a custom domain, go to Project Settings and enter your domain. You'll need to add a CNAME record pointing to your Jamdesk subdomain."
                    url: "https://acme.jamdesk.app/deploy/custom-domains"
                    score: 0.94
                total: 1
                durationMs: 85
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingQuery:
                  summary: Missing query field
                  value:
                    error: 'Missing or empty "query" field'
                queryTooLong:
                  summary: Query too long
                  value:
                    error: "Query exceeds 500 characters"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid or missing API key"
        "403":
          description: API key does not match project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "API key does not match this project"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
              example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Rate limit exceeded"
        "502":
          description: Search temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Search temporarily unavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key generated from your Jamdesk dashboard (Settings → Knowledge API Keys).
        Format: `jdk_<token>`
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
