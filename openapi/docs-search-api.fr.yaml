openapi: 3.1.0
info:
  title: Jamdesk Docs Search API
  version: "1.0.0"
  summary: Recherche vectorielle sémantique dans votre documentation pour les chatbots, les pipelines RAG et les intégrations personnalisées.
  description: |
    L'API Jamdesk Docs Search vous permet d'interroger votre documentation par programmation
    en langage naturel. Elle repose sur le même moteur de recherche vectorielle sémantique
    qui alimente le chat IA intégré de Jamdesk — toute requête fonctionnant dans le
    widget de chat fonctionne ici et retourne les mêmes résultats.

    ## Cas d'usage

    - **Base de connaissances pour chatbot** — alimentez un bot de support ou un bot Slack avec une
      documentation à jour afin qu'il puisse répondre précisément aux questions des utilisateurs.
    - **Intégration dans un pipeline RAG** — récupérez des extraits de documentation pertinents à
      injecter dans les prompts LLM pour une génération ancrée dans les faits (compatible avec OpenAI
      Assistants, les agents Claude, LangChain et LlamaIndex).
    - **Intégrations personnalisées** — connectez la recherche dans la documentation à des outils internes,
      des extensions IDE, des dashboards CRM et des flux d'onboarding.
    - **Récupération pour assistant IA** — alimentez n'importe quel assistant IA avec une recherche
      documentaire en temps réel sans avoir à préconstruire vous-même des embeddings.

    ## Fonctionnement

    Chaque requête est encodée dans un vecteur à l'aide du même modèle d'embeddings qui a
    indexé votre documentation. L'API retourne les meilleures correspondances classées par similarité
    cosinus, avec des extraits que vous pouvez passer directement à un LLM en tant que contexte.

    Les requêtes en langage naturel sont plus efficaces que les requêtes par mots-clés — posez
    « comment s'authentifier avec OAuth » plutôt que « configuration authentification OAuth ».
    Le moteur comprend l'intention, les synonymes et le contexte.

    ## Authentification et limites

    - **Authentification :** jeton Bearer. Générez une clé API dans votre
      [Jamdesk dashboard](https://dashboard.jamdesk.com) sous
      Paramètres → Clés API. Les clés sont préfixées `jd_live_` suivies de 32
      caractères hexadécimaux (40 caractères au total) et n'expirent jamais. Révoquez-les depuis
      le dashboard.
    - **Prérequis d'abonnement :** Jamdesk Pro ou supérieur.
    - **Limite de débit :** 60 requêtes par minute par clé API. Les requêtes dépassant cette limite
      retournent HTTP 429 avec un en-tête `Retry-After`.
    - **CORS :** Activé. Les clients côté navigateur peuvent appeler l'API directement
      sans proxy backend.
    - **Format de réponse :** JSON. Chaque réponse inclut les champs `query`, `results`,
      `total` et `durationMs`.

    ## URL de base

    `https://YOUR-PROJECT.jamdesk.app` ou votre domaine personnalisé. Le slug de votre projet
    est visible dans l'URL du Jamdesk dashboard.
  contact:
    name: Jamdesk Support
    url: https://jamdesk.com/support
    email: support@jamdesk.com
  termsOfService: https://jamdesk.com/terms

externalDocs:
  description: Référence complète de l'API Jamdesk Docs Search et guides d'intégration
  url: https://jamdesk.com/docs/jamdesk-api

servers:
  - url: https://{project}.jamdesk.app
    description: Sous-domaine Jamdesk (par défaut)
    variables:
      project:
        default: your-project
        description: |
          Le slug de votre projet Jamdesk. Visible dans l'URL de votre dashboard
          (par exemple `acme` pour `acme.jamdesk.app`).
  - url: https://{customDomain}
    description: Domaine personnalisé (documentation servie à la racine)
    variables:
      customDomain:
        default: docs.example.com
        description: |
          Votre domaine personnalisé Jamdesk, configuré dans Paramètres du projet → Domaine.
  - url: https://{host}{basePath}
    description: |
      Hôte personnalisé avec sous-chemin hostAtDocs. Utilisez cette option lorsque votre site de documentation
      est servi sous un chemin (par exemple `jamdesk.com/docs`) plutôt qu'à la
      racine d'un domaine. L'API Docs Search est accessible à la fois via
      `{basePath}/_api/search` et (en accès direct) via `/_api/search` de l'origine
      — les deux sont réécrits côté serveur vers le même
      endpoint avec portée de projet.
    variables:
      host:
        default: jamdesk.com
        description: |
          L'hôte de votre site de documentation. Pour la démo publique Jamdesk docs,
          il s'agit de `jamdesk.com`.
      basePath:
        default: /docs
        description: |
          Préfixe de chemin si votre documentation est sous un sous-chemin. Chaîne vide
          (ou omettez le serveur) si elle est servie à la racine du domaine.

tags:
  - name: Search
    description: |
      Opérations de recherche vectorielle sémantique dans la documentation de votre projet.
      Retourne des résultats classés avec des scores de pertinence, utilisables directement
      dans des prompts LLM ou affichés directement aux utilisateurs.
    externalDocs:
      description: Fonctionnement de la recherche sémantique dans Jamdesk
      url: https://jamdesk.com/docs/jamdesk-api

security:
  - BearerAuth: []

paths:
  /_api/search:
    post:
      tags:
        - Search
      operationId: searchDocs
      summary: Rechercher dans la documentation avec des requêtes en langage naturel
      description: |
        Effectue une recherche vectorielle sémantique dans la documentation de votre projet et
        retourne les pages correspondantes classées par score de pertinence.

        Les requêtes sont encodées dans le même espace vectoriel utilisé pour indexer votre documentation,
        de sorte que la recherche comprend l'intention — pas seulement les mots-clés. Posez une question
        complète en langage naturel pour de meilleurs résultats.

        **Forme de la réponse :** un tableau de résultats (titre, section, slug, extrait de contenu,
        URL, score), ainsi que la requête originale, le nombre total de résultats et la durée de recherche.
        Le champ extrait est limité à 500 caractères et est directement utilisable comme contexte LLM.

        **Latence typique :** 50 à 200 ms pour les requêtes sur des projets de moins de 10 000
        pages. La latence croît de manière sous-linéaire avec la taille de l'index.
      x-codeSamples:
        - lang: JavaScript
          label: fetch
          source: |
            const response = await fetch(
              'https://your-project.jamdesk.app/_api/search',
              {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer jd_live_c83003a54ae0a83123454c3f7ec82f0a',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  query: 'How do I authenticate with OAuth?',
                  limit: 5,
                }),
              }
            );
            const { results } = await response.json();
            console.log(results);
        - lang: Python
          label: requests
          source: |
            import requests

            response = requests.post(
                "https://your-project.jamdesk.app/_api/search",
                headers={
                    "Authorization": "Bearer jd_live_c83003a54ae0a83123454c3f7ec82f0a",
                    "Content-Type": "application/json",
                },
                json={
                    "query": "How do I authenticate with OAuth?",
                    "limit": 5,
                },
            )
            results = response.json()["results"]
            print(results)
        - lang: curl
          label: curl
          source: |
            curl -X POST https://your-project.jamdesk.app/_api/search \
              -H "Authorization: Bearer jd_live_c83003a54ae0a83123454c3f7ec82f0a" \
              -H "Content-Type: application/json" \
              -d '{"query": "How do I authenticate with OAuth?", "limit": 5}'
        - lang: curl
          label: curl (Espagnol)
          source: |
            curl -X POST https://your-project.jamdesk.app/_api/search \
              -H "Authorization: Bearer jd_live_c83003a54ae0a83123454c3f7ec82f0a" \
              -H "Content-Type: application/json" \
              -d '{"query": "¿Cómo configuro un dominio personalizado?", "limit": 5, "language": "es"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Requête de recherche en langage naturel.
                  maxLength: 500
                  example: "How do I set up webhooks?"
                limit:
                  type: integer
                  description: Nombre maximum de résultats à retourner.
                  minimum: 1
                  maximum: 20
                  default: 5
                  example: 5
                language:
                  type: string
                  description: |
                    Code de langue BCP-47 (par ex. `en`, `es`, `pt-BR` ;
                    les tags à 3 segments comme `zh-Hant-HK` ne sont pas
                    pris en charge). Filtre les résultats sur cette langue
                    dans les projets multilingues ; ignoré dans les projets
                    monolingues. Par défaut `en`.
                  pattern: "^[a-zA-Z]{2,3}([-_][a-zA-Z]{2,4})?$"
                  default: en
                  example: es
            examples:
              naturalQuestion:
                summary: Question en langage naturel (recommandé)
                value:
                  query: "How do I configure a custom domain for my docs site?"
                  limit: 5
              shortKeyword:
                summary: Requête courte par mots-clés (fonctionne, mais moins précise)
                value:
                  query: "webhooks"
                  limit: 10
              ragContext:
                summary: Résultats maximum pour le contexte d'un pipeline RAG
                value:
                  query: "authentication options and API key management"
                  limit: 20
              multiLanguage:
                summary: Filtrer par langue (projets multilingues)
                value:
                  query: "¿Cómo configuro un dominio personalizado?"
                  limit: 5
                  language: "es"
      responses:
        "200":
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Titre de la page.
                          example: "Webhooks"
                        section:
                          type: string
                          description: En-tête de section dans la page (le cas échéant).
                          example: "Configuration"
                        slug:
                          type: string
                          description: Chemin URL vers la page.
                          example: "integrations/webhooks"
                        content:
                          type: string
                          description: Extrait de contenu (500 caractères max).
                          example: "Configure webhooks to receive real-time notifications when builds complete..."
                        url:
                          type: string
                          format: uri
                          description: URL complète vers la page.
                          example: "https://docs.example.com/integrations/webhooks"
                        score:
                          type: number
                          format: float
                          description: Score de pertinence (similarité cosinus, 0.0–1.0). Plus la valeur est élevée, meilleur est le résultat.
                          minimum: 0
                          maximum: 1
                          example: 0.92
                  query:
                    type: string
                    description: La requête qui a été recherchée.
                    example: "How do I set up webhooks?"
                  language:
                    type: string
                    description: Langue résolue. Reprend la valeur envoyée,
                      avec `en` par défaut si la requête a omis le champ.
                    example: "en"
                  total:
                    type: integer
                    description: Nombre de résultats retournés.
                    example: 3
                  durationMs:
                    type: integer
                    description: Temps d'exécution de la recherche côté serveur en millisecondes (hors aller-retour réseau).
                    example: 150
              examples:
                multiResult:
                  summary: Requête en langage naturel avec plusieurs résultats
                  value:
                    query: "How do I set up a custom domain?"
                    language: "en"
                    results:
                      - title: "Custom Domains"
                        section: "Step 4: Deploy"
                        slug: "deploy/custom-domains"
                        content: "To add a custom domain, go to Project Settings and enter your domain. You'll need to add a CNAME record pointing to your Jamdesk subdomain."
                        url: "https://acme.jamdesk.app/deploy/custom-domains"
                        score: 0.94
                      - title: "DNS configuration"
                        section: "Custom domains"
                        slug: "deploy/dns"
                        content: "Custom domains require an A record or CNAME pointing to your Jamdesk subdomain..."
                        url: "https://acme.jamdesk.app/deploy/dns"
                        score: 0.87
                    total: 2
                    durationMs: 85
                shortKeyword:
                  summary: Requête par mots-clés avec un seul résultat
                  value:
                    query: "webhooks"
                    results:
                      - title: "Webhooks"
                        section: "Configuration"
                        slug: "integrations/webhooks"
                        content: "Configure webhooks to receive real-time notifications when builds complete, deploys finish, or errors occur..."
                        url: "https://acme.jamdesk.app/integrations/webhooks"
                        score: 0.91
                    total: 1
                    durationMs: 62
                zeroResults:
                  summary: Requête sans correspondance
                  value:
                    query: "quantum entanglement deployment strategy"
                    results: []
                    total: 0
                    durationMs: 48
        "400":
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingQuery:
                  summary: Champ query manquant
                  value:
                    error: 'Missing or empty "query" field'
                queryTooLong:
                  summary: Requête trop longue
                  value:
                    error: "Query exceeds 500 characters"
                invalidLanguage:
                  summary: Code de langue mal formé
                  value:
                    error: "Invalid language code"
        "401":
          description: |
            Clé API invalide ou manquante. Le corps de la réponse contient un
            code `error` lisible par machine : `invalid_key_format` (manquante
            ou mal formée — par exemple, ne correspond pas à `jd_live_<32 hex>`, 40 caractères) ou
            `invalid_key` (clé non reconnue ou révoquée).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidKeyFormat:
                  summary: En-tête Authorization manquant ou clé mal formée
                  value:
                    error: "invalid_key_format"
                invalidKey:
                  summary: Clé non reconnue ou révoquée
                  value:
                    error: "invalid_key"
        "403":
          description: |
            La clé API ne correspond pas à ce projet. La clé est valide mais a été
            générée pour un slug de projet différent de celui figurant dans l'URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "wrong_project"
        "429":
          description: Limite de débit dépassée
          headers:
            Retry-After:
              schema:
                type: integer
              description: Nombre de secondes à attendre avant de réessayer.
              example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Rate limit exceeded"
        "502":
          description: Recherche temporairement indisponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Search temporarily unavailable"
        "503":
          description: |
            Panne temporaire du backend lors de la vérification de la clé. Retourné lorsque
            la recherche Redis échoue ou que le magasin d'authentification est inaccessible — réessayez
            après un court délai. Le corps de la réponse contient un
            code `error` lisible par machine : `lookup_failed` ou
            `redis_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                lookupFailed:
                  summary: Échec de la recherche dans le magasin d'authentification
                  value:
                    error: "lookup_failed"
                redisUnavailable:
                  summary: Magasin d'authentification inaccessible
                  value:
                    error: "redis_unavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Clé API générée depuis votre Jamdesk dashboard (Paramètres → Clés API).
        Format : `jd_live_<32 caractères hex>` (40 caractères). Gardez les clés secrètes. Révoquez-les
        et régénérez-les depuis le dashboard — il n'y a pas de rotation en place.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: |
            Détail de l'erreur. Les réponses d'authentification (401), d'autorisation (403) et
            de panne backend (503) retournent un code stable lisible par machine
            (par exemple `invalid_key`, `wrong_project`, `lookup_failed`) afin que
            les clients puissent se brancher sur la valeur. Les réponses de validation de requête (400),
            de limite de débit (429) et de recherche indisponible (502) retournent
            actuellement une phrase lisible par un humain.
